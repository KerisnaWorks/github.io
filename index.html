<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kerisna Santosa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070b16;
            color: white;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #2563eb;
            filter: blur(180px);
            opacity: 0.18;
            top: -200px;
            left: -150px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #7c3aed;
            filter: blur(180px);
            opacity: 0.16;
            right: -150px;
            bottom: -150px;
            z-index: -1;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(7, 11, 22, 0.7);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 10;
        }

        nav h2 {
            font-size: 25px;
            letter-spacing: -1px;
        }

        nav h2 span {
            color: #60a5fa;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 28px;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 8% 80px;
            position: relative;
        }

        .hero-content {
            max-width: 850px;
        }

        .small {
            color: #60a5fa;
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 22px;
        }

        .hero h1 {
            font-size: clamp(48px, 8vw, 90px);
            line-height: 0.95;
            letter-spacing: -4px;
            margin-bottom: 30px;
        }

        .hero h1 span {
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            color: transparent;
        }

        .intro {
            color: #aeb9cc;
            font-size: 20px;
            line-height: 1.7;
            max-width: 650px;
