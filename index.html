<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerisna Santosa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
        }

        nav h2 {
            color: #38bdf8;
            font-size: 32px;
        }

        nav a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 20px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 8%;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            font-size: 20px;
            color: #cbd5e1;
            max-width: 600px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 25px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            width: fit-content;
        }
    </style>
</head>

<body>

    <nav>
        <h2>Kerisna.</h2>
        <a href="#">Home</a>
    </nav>

    <section class="hero">
        <h1>Halo, saya <span>Kerisna Santosa</span></h1>

        <p>
            Mahasiswa Informatika yang sedang membangun kemampuan,
            mencari pengalaman, dan menemukan arah karier di dunia teknologi.
        </p>

        <a class="btn" href="#">Tentang Saya</a>
    </section>

</body>
</html>
